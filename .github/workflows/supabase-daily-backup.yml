
name: Supabase Daily Backup

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comet-autos-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create encrypted backup and verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          test -n "$SUPABASE_DB_URL"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"

          mkdir -p backup
          DUMP="backup/comet-autos-$(date -u +%Y%m%dT%H%M%SZ).dump"
          ENC="${DUMP}.enc"

          pg_dump \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$DUMP" \
            "$SUPABASE_DB_URL"

          test -s "$DUMP"
          pg_restore --list "$DUMP" > /dev/null

          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$DUMP" \
            -out "$ENC" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$ENC" \
            -out backup/verify.dump \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          cmp "$DUMP" backup/verify.dump
          pg_restore --list backup/verify.dump > /dev/null

          sha256sum "$ENC" > "${ENC}.sha256"

          rm -f "$DUMP" backup/verify.dump

          test -s "$ENC"
          test -s "${ENC}.sha256"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: comet-autos-backup-${{ github.run_id }}
          path: backup/*.dump.enc*
          if-no-files-found: error
          retention-days: 30
