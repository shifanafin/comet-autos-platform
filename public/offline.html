<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f8" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f4f5f8;
        color: #14141a;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #a78bfa, #7c3aed 55%, #6d28d9);
        color: #fff; font-weight: 700; font-size: 30px;
      }
      h1 { margin: 8px 0 0; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0; color: #5b6472; }
      button {
        margin-top: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
        background: #7c3aed; color: #f8f8fa; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:active { background: #5b21b6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">C</div>
      <h1>You’re offline</h1>
      <p>The app needs a connection to show live jobs, quotations and invoices. Nothing you saved has been lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection does.
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
